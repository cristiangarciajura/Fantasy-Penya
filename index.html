<!doctype html><html lang="es"><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Fantasy Penya · Demo</title><style>body{margin:0;background:#101b32;color:white;font:16px system-ui}header{background:#20395f;padding:20px;text-align:center}main{max-width:760px;margin:auto;padding:18px}.pitch{background:repeating-linear-gradient(#247548 0 65px,#2b8050 65px 130px);border:3px solid #d3e7d5;border-radius:14px;padding:18px;min-height:380px}.line{display:flex;justify-content:space-around;margin:25px 0}.slot{background:#f3c458;color:#14213a;border:0;border-radius:12px;padding:10px;min-width:58px;cursor:pointer}.panel{background:#20395f;padding:16px;border-radius:12px;margin-top:16px}input,select,button{font:inherit;padding:10px;border-radius:8px}button{cursor:pointer}#players button{display:block;width:100%;margin:6px 0;text-align:left}small{color:#c8d2e5}</style><header><h1>⚽ FANTASY PENYA</h1><small>Versión web de prueba · 11 titulares + 1 técnico</small></header><main><p>Selecciona una casilla y elige un futbolista. Los nombres son de demostración, no la plantilla real.</p><div class="pitch" id="pitch"></div><section class="panel"><b>Seleccionar futbolista</b><p id="selected">Pulsa una posición del campo</p><input id="search" placeholder="Buscar..." oninput="renderPlayers()"><div id="players"></div></section><section class="panel"><h3>Entrenador</h3><select id="coach"><option value="">Seleccionar técnico</option><option>Técnico de prueba A</option><option>Técnico de prueba B</option></select><p><button onclick="save()">Guardar once</button></p><small id="status">Los datos se guardan únicamente en este navegador.</small></section></main><script>const formation=[['POR'],['DEF','DEF','DEF','DEF'],['MED','MED','MED'],['DEL','DEL','DEL']];const names=Array.from({length:36},(_,i)=>({name:'Jugador de prueba '+(i+1),pos:i<4?'POR':i<16?'DEF':i<27?'MED':'DEL'}));let slots=formation.flat().map((pos,i)=>({pos,name:''}));let active=0;try{const d=JSON.parse(localStorage.getItem('fp-demo')||'null');if(d&&d.slots?.length===11)slots=d.slots; if(d?.coach)document.getElementById('coach').value=d.coach}catch{}function render(){let k=0;document.getElementById('pitch').innerHTML=formation.map(line=>'<div class="line">'+line.map(()=>{let i=k++,s=slots[i];return '<button class="slot" onclick="choose('+i+')">'+(s.name||s.pos)+'</button>'}).join('')+'</div>').join('')}function choose(i){active=i;document.getElementById('selected').textContent='Posición: '+slots[i].pos;renderPlayers()}function renderPlayers(){let q=document.getElementById('search').value.toLowerCase();document.getElementById('players').innerHTML=names.filter(n=>n.pos===slots[active].pos&&n.name.toLowerCase().includes(q)).map(n=>'<button onclick="assign('+names.indexOf(n)+')">'+n.name+'</button>').join('')}function assign(i){if(slots.some((s,j)=>j!==active&&s.name===names[i].name))return alert('Ya está seleccionado');slots[active].name=names[i].name;render()}function save(){if(slots.some(s=>!s.name)||!document.getElementById('coach').value)return alert('Selecciona 11 futbolistas y un técnico');localStorage.setItem('fp-demo',JSON.stringify({slots,coach:document.getElementById('coach').value}));document.getElementById('status').textContent='Alineación guardada en este navegador'}render();choose(0)</script></html>
